<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2c2416"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b6f47"/></marker>
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#8b6f47" stroke-width="5"/></pattern>
</defs>
<rect width="1200" height="600" fill="#ece3d2"/>
<rect x="90" y="60" width="1020" height="480" fill="#fdfcfa" stroke="#2c2416" stroke-width="3" />
<text x="130" y="122" font-family="'Times New Roman', Times, Georgia, serif" font-size="30" fill="#6b5d4f" text-anchor="start" letter-spacing="2">base20.c</text>
<line x1="90" y1="150" x2="1110" y2="150" stroke="#cfc2b1" stroke-width="2" />
<text x="130" y="214" font-family="Consolas, 'Courier New', monospace" font-size="40" fill="#2c2416" xml:space="preserve">long to_decimal(const char *s)</text>
<text x="130" y="262" font-family="Consolas, 'Courier New', monospace" font-size="40" fill="#2c2416" xml:space="preserve">{</text>
<text x="130" y="310" font-family="Consolas, 'Courier New', monospace" font-size="40" fill="#2c2416" xml:space="preserve">    long n = 0;</text>
<text x="130" y="358" font-family="Consolas, 'Courier New', monospace" font-size="40" fill="#2c2416" xml:space="preserve">    for (; *s; s++)</text>
<text x="130" y="406" font-family="Consolas, 'Courier New', monospace" font-size="40" fill="#2c2416" xml:space="preserve">        n = n * 20 + digit(*s);</text>
<text x="130" y="454" font-family="Consolas, 'Courier New', monospace" font-size="40" fill="#2c2416" xml:space="preserve">    return n;</text>
<text x="130" y="502" font-family="Consolas, 'Courier New', monospace" font-size="40" fill="#2c2416" xml:space="preserve">}</text>
<rect x="476" y="368" width="56" height="50" fill="none" stroke="#8b6f47" stroke-width="4"/>
</svg>
